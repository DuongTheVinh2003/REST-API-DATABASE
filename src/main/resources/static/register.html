<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - JWT Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/auth.js"></script>
</head>
<body class="bg-light">
<div class="container">
    <div class="card mx-auto mt-5" style="max-width: 400px;">
        <div class="card-header"><h3>Đăng ký tài khoản</h3></div>
        <div class="card-body">
            <form onsubmit="register(event)">
                <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>
                <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" id="password" class="form-control mb-3" placeholder="Mật khẩu" required>
                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>
            <p class="text-center mt-3">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
