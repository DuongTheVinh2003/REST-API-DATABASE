<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - JWT Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('token')) {
                alert('Chưa đăng nhập!');
                window.location.href = 'login.html';
            } else {
                document.getElementById('welcomeUser').textContent = localStorage.getItem('username') || 'User';
            }
        });
    </script>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Xin chào, <span id="welcomeUser"></span>!</span>
        <button class="btn btn-outline-light" onclick="logout()">Đăng xuất</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">User Area</div>
                <div class="card-body">
                    <button class="btn btn-info w-100" onclick="callUserApi()">Xem Profile</button>
                    <pre id="userResult" class="mt-3 bg-light p-3 border"></pre>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header text-danger">ADMIN ONLY</div>
                <div class="card-body">
                    <button class="btn btn-danger w-100" onclick="callAdminApi()">Vào Admin Dashboard</button>
                    <pre id="adminResult" class="mt-3 bg-light p-3 border"></pre>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
